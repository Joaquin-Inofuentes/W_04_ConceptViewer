<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Visor de dibujos .concepts de Concepts, con galeria de Google Drive." />
    <title>ConceptSerializer — Visor de dibujos</title>

    <!-- El primer dato que pide la app es el cache de carpetas de Supabase.
         Abrir DNS+TLS por adelantado ahorra ~300-600 ms en 3G, que es tiempo
         en el que la galeria ya podria estar mostrando contenido. -->
    <link rel="preconnect" href="https://kuhcxzusnrttkywgalgk.supabase.co" crossorigin />
    <link rel="dns-prefetch" href="https://kuhcxzusnrttkywgalgk.supabase.co" />

    <!-- Escucha de accesos del parque: un ingreso y un egreso por visita, a
         unx_accesos. Lee el nombre sola de localStorage
         (conceptserializer_user_name), asi que no hace falta avisarle. -->
    <script src="/escucha-accesos.js" data-proyecto="concept"></script>

    <!-- Skeleton estatico: se pinta con el HTML, sin esperar a que baje ni se
         ejecute el JS. En un telefono de gama baja en 3G eso son ~2,5 s de
         diferencia entre "pantalla en blanco" y "algo que se parece a la app".
         React lo reemplaza al montar. -->
    <!-- El tema se aplica ANTES de pintar nada: si esperara a React, un
         usuario con tema oscuro veria un fogonazo blanco en cada carga. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem("conceptserializer_tema");
          document.documentElement.setAttribute("data-theme", t === "claro" ? "claro" : "oscuro");
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "oscuro");
        }
      })();
    </script>

    <style>
      /* Oscuro por defecto; el atributo data-theme="claro" lo cambia. */
      :root { color-scheme: dark; --boot-fondo: #0f1116; --boot-texto: #e7e9ee; --boot-tenue: #99a0b0; --boot-borde: #262a35; --boot-tarjeta: #191c24; --boot-sk1: #1d212b; --boot-sk2: #262b38; }
      :root[data-theme="claro"] { color-scheme: light; --boot-fondo: #f8f9fa; --boot-texto: #212529; --boot-tenue: #6c757d; --boot-borde: #dee2e6; --boot-tarjeta: #ffffff; --boot-sk1: #eceef0; --boot-sk2: #f4f6f8; }
      html, body { margin: 0; padding: 0; background: var(--boot-fondo); }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--boot-texto);
      }
      #boot { padding: 2rem clamp(1rem, 5vw, 3rem); }
      #boot h1 { font-size: 1.6rem; margin: 0 0 .35rem; letter-spacing: -0.02em; }
      #boot p { margin: 0 0 1.75rem; color: var(--boot-tenue); font-size: .92rem; }
      #boot .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(159px, 1fr));
        gap: 1rem;
      }
      #boot .card {
        border: 1px solid var(--boot-borde);
        border-radius: 12px;
        background: var(--boot-tarjeta);
        padding: .75rem;
      }
      #boot .thumb {
        aspect-ratio: 1;
        border-radius: 8px;
        background: linear-gradient(90deg, var(--boot-sk1) 25%, var(--boot-sk2) 37%, var(--boot-sk1) 63%);
        background-size: 400% 100%;
        animation: bootShimmer 1.4s ease infinite;
      }
      #boot .line {
        height: 10px;
        margin-top: .6rem;
        border-radius: 4px;
        background: var(--boot-sk1);
      }
      @keyframes bootShimmer {
        0% { background-position: 100% 50%; }
        100% { background-position: 0 50%; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .thumb { animation: none; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <h1>ConceptSerializer</h1>
        <p>Cargando dibujos…</p>
        <div class="grid">
          <div class="card"><div class="thumb"></div><div class="line"></div></div>
          <div class="card"><div class="thumb"></div><div class="line"></div></div>
          <div class="card"><div class="thumb"></div><div class="line"></div></div>
          <div class="card"><div class="thumb"></div><div class="line"></div></div>
          <div class="card"><div class="thumb"></div><div class="line"></div></div>
          <div class="card"><div class="thumb"></div><div class="line"></div></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
